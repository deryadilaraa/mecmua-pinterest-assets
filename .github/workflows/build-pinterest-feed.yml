name: Build Pinterest RSS feed
on:
  push:
    branches: [main]
    paths:
      - "assets/pin-queue.csv"
      - "scripts/build-pinterest-feed.mjs"
      - ".github/workflows/build-pinterest-feed.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate RSS and pin data
        run: node scripts/build-pinterest-feed.mjs
      - name: Commit generated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml pins.json
          if git diff --cached --quiet; then
            echo "Feed is already current."
          else
            git commit -m "Refresh Pinterest RSS feed"
            git push
          fi
