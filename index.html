<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A curated edit of objects, spaces and things worth keeping.">
<title>mecmua · curated finds</title>
<style>
:root{color-scheme:light;--ink:#24201f;--muted:#756d68;--line:#e8e1dc;--paper:#fbf8f5;--gold:#9d7951}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Georgia,serif}
main{max-width:1160px;margin:auto;padding:32px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 0 22px}
.brand{font:600 13px system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
a{color:inherit}.feed{font:13px system-ui,sans-serif;color:var(--muted)}
h1{font-size:clamp(34px,6vw,64px);font-weight:400;line-height:1.02;margin:56px 0 12px}
.intro{max-width:580px;color:var(--muted);font-size:18px;margin:0 0 42px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
.card{display:block;text-decoration:none}.card img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#eee}
.card h2{font-size:17px;font-weight:400;margin:9px 0 2px}.card p{font:12px system-ui,sans-serif;color:var(--muted);margin:0}
footer{margin-top:52px;border-top:1px solid var(--line);padding-top:18px;font:12px system-ui,sans-serif;color:var(--muted)}
</style>
</head>
<body>
<main>
<nav class="top"><span class="brand">mecmua</span><a class="feed" href="/feed.xml">RSS feed</a></nav>
<h1>Curated finds</h1>
<p class="intro">Objects, images and details selected with a curator’s eye. Open a find for its story and shopping link.</p>
<section id="grid" class="grid" aria-live="polite"></section>
<footer>Some product links are affiliate links. Mecmua may earn a commission from qualifying purchases.</footer>
</main>
<script>
(async()=>{
 const grid=document.getElementById("grid");
 try{
  const r=await fetch("/pins.json");if(!r.ok)throw new Error();
  const pins=await r.json();
  for(const pin of pins.slice(0,24)){
   const a=document.createElement("a");a.className="card";a.href="/pin.html?id="+encodeURIComponent(pin.id);
   const img=document.createElement("img");img.src=pin.image_url;img.alt=pin.pin_title;img.loading="lazy";
   const title=document.createElement("h2");title.textContent=pin.pin_title;
   const merchant=document.createElement("p");merchant.textContent=pin.merchant+" · "+pin.theme.replace(/-/g," ");
   a.append(img,title,merchant);grid.append(a);
  }
 }catch(e){grid.textContent="The collection is loading.";}
})();
</script>
</body>
</html>
